<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Polyaéro Moodle</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--blanc); color:var(--texte); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; left:480px; top:0; }
  .art svg { display:block; }
  .marine { fill:var(--marine); }
  .fonce { fill:var(--marine-fonce); }
  .jaune { fill:var(--jaune); }
  .pale { fill:var(--jaune-pale); }
  .gris { fill:var(--gris-fond); }
  .frame { rx:var(--radius-bandeau); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--marine); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--texte-secondaire); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      marine-fonce 112×288 (the section-number column) · marine 240×288 (the section banner) · jaune 128×144 over jaune-pale 128×144 at the right edge (the accent and the FinSection strip)
  arrangement the EnTeteSection banner enlarged: number column then banner, both full height, bleeding off top and bottom, rounded on the left by radius-bandeau like the real banner; the yellow pair closes it as the end-of-section strip does
  pattern     five jaune discs (32px, radius-rond) stacked in the number column at a 48px pitch: the Sommaire numbered stops, the course read as a path of sections
  scales      disc 32px with 16px gaps (space-4), column 112px as in EnTeteSection (110 rounded to the 16 grid), radius-bandeau 10px on the outer frame
-->
<defs><clipPath id="c"><rect class="frame" x="0" y="-20" width="500" height="328" rx="10"/></clipPath></defs>
<g clip-path="url(#c)">
  <rect class="fonce" x="0" y="0" width="112" height="288"/>
  <rect class="marine" x="112" y="0" width="240" height="288"/>
  <rect class="jaune" x="352" y="0" width="128" height="144"/>
  <rect class="pale" x="352" y="144" width="128" height="144"/>
  <circle class="jaune" cx="56" cy="48" r="16"/>
  <circle class="jaune" cx="56" cy="96" r="16"/>
  <circle class="jaune" cx="56" cy="144" r="16"/>
  <circle class="jaune" cx="56" cy="192" r="16"/>
  <circle class="jaune" cx="56" cy="240" r="16"/>
</g>
</svg>
</div>
<div class="words">
  <h1 class="name">Polyaéro<br>Moodle</h1>
  <p class="tag">Des cours en ligne épurés et pédagogiques</p>
</div>
</div>
</body>
</html>
